name: step5-evidence-consistency

on:
  push:
    branches:
      - step5-evidence-consistency
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step5-evidence-consistency

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build headless round-trip bundle
        run: npx webpack --config webpack.test.config.js

      - name: Run round-trip suite and executable evidence inventory
        run: node test/run_evidence_inventory.js
