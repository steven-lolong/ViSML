name: criterion-p-independent-oracle

on:
  push:
    branches:
      - criterion-p-independent-oracle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  step4:
    if: ${{ !contains(github.event.head_commit.message || '', '[step4-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: criterion-p-independent-oracle

      - name: Apply Step 4 artifact repairs
        run: python3 tools/step4_independent_oracle_patch.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run round-trip, T, and independent P suite
        run: npm run test:roundtrip

      - name: Commit validated Step 4 artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/core/parser/sml_to_visml.ts \
            src/core/blocks/constants.ts \
            src/core/generator/sml/blocks/constants.ts \
            src/core/generator/sml/blocks/expressions/expression_let_in_end.ts \
            src/core/generator/sml/blocks/declarations/strbind.ts \
            test/roundtrip.entry.ts \
            test/run_roundtrip.js
          if git diff --cached --quiet; then
            echo "No generated Step 4 changes to commit"
          else
            git commit -m "test: validate independent criterion P oracle [step4-applied]"
            git push
          fi
