name: Contextual distinction evidence

on:
  push:
    branches: [main, contextual-distinction-evidence]
  pull_request:

jobs:
  contextual-distinction-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:contextual
